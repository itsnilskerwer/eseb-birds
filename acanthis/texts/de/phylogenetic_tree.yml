    Few sentences that descibe the idea of a phylogenetic tree.
  FILL_IN:
    Ein phylogenetischer Baum (auch Phylogenie oder Evolutionsbaum) ist ein Verzweigungsdiagramm oder ein Baum, der die evolutionären Beziehungen zwischen verschiedenen biologischen Arten oder anderen Entitäten auf der Grundlage von Ähnlichkeiten und Unterschieden in ihren physischen oder genetischen Merkmalen zeigt. Alles Leben auf der Erde ist Teil eines einzigen phylogenetischen Baums, was auf eine gemeinsame Abstammung hinweist.

