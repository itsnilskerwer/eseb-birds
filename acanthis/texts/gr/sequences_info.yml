maintext:
  description:
    Few sentences that describe DNA and invite to see how a sequence of DNA looks like in the brown pelican. 
  FILL_IN:
    Κοιτάζοντας πολύ προσεκτικά τα κύτταρα του δείγματός μας, οι ερευνητές μπορούν να απομονώσουν το υλικό που συνθέτει τον γενετικό κώδικα μέσα στα ζωντανά κύτταρα. Μπορούμε να φανταστούμε αυτό το γενετικό υλικό (που ονομάζεται επίσης DNA) ως μια αλληλουχία μορίων, όπως μια λέξη που αποτελείται από τα γράμματα A, C, G και T. Ακολουθεί ένα παράδειγμα ενός τμήματος του DNA του καφέ πελεκάνου.

